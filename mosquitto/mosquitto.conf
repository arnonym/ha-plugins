# Local/dev broker for ha-sip's stand-alone MQTT mode (see docker-compose.yaml
# and README.md's "Stand-alone mode"). Anonymous access is fine here since the
# port is only published to localhost -- don't reuse this config for a
# broker exposed beyond the local machine.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
