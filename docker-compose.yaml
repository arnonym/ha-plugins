services:
    ha-sip:
        build:
            context: ./ha-sip
            dockerfile: Dockerfile
            args:
                BUILD_FROM: debian:bookworm
        network_mode: host
        env_file: ./.env

    # The Kotlin app and a local MQTT broker for it. Neither starts with a bare
    # `docker compose up`; use `docker compose --profile ng up` (or name the service,
    # e.g. `docker compose up ha-sip-ng`). Don't run both apps at once against the same
    # SIP account/port.
    ha-sip-ng:
        profiles:
            - ng
        build:
            context: ./ha-sip-ng
            dockerfile: Dockerfile
            args:
                BUILD_FROM: debian:trixie
        network_mode: host
        env_file: ./.env
        depends_on:
            - mosquitto

    mosquitto:
        profiles:
            - ng
        image: eclipse-mosquitto:2
        volumes:
            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
            - mosquitto-data:/mosquitto/data
        # ha-sip-ng reaches this via network_mode: host, i.e. localhost:1883 --
        # bound to localhost only, not exposed beyond this machine.
        ports:
            - "127.0.0.1:1883:1883"
        restart: unless-stopped

volumes:
    mosquitto-data:
