name: Build ha-sip-kt

# Same shape as build-ha-sip.yml: tests on every push to main/next that touches
# the app, images built and pushed only from `next`. That holds here (production
# images, released to users by merging next into main) as well as in the beta mirror
# ha-plugins-next (where `mise run update-next-repo` renames the image to -next).
on:
  push:
    branches: [ main, next ]
    paths:
      - 'ha-sip-kt/**'
      - '.github/workflows/build-ha-sip-kt.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run :core tests (pure Kotlin, no pjsip/Docker needed)
        working-directory: ha-sip-kt
        run: ./gradlew :core:test --no-daemon --console=plain

  build:
    needs: test
    if: github.ref_name == 'next'
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read BUILD_FROM base image + app image/version
        id: manifest
        working-directory: ha-sip-kt
        run: |
          echo "build_from=$(jq -r '.build_from.${{ matrix.arch }}' build.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' config.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.name' config.json)" >> "$GITHUB_OUTPUT"
          # From config.json rather than hard-coded, so the beta mirror pushes to
          # ghcr.io/arnonym/<arch>-ha-sip-kt-next with this same workflow file.
          echo "image=$(jq -r '.image' config.json | sed 's/{arch}/${{ matrix.arch }}/')" >> "$GITHUB_OUTPUT"

      # The built-in GITHUB_TOKEN is enough (job permission `packages: write`), so no
      # registry secret is needed -- in this repository or in the beta mirror.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: ha-sip-kt
          file: ha-sip-kt/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.manifest.outputs.build_from }}
          cache-from: type=gha,scope=ha-sip-kt-${{ matrix.arch }}
          cache-to: type=gha,scope=ha-sip-kt-${{ matrix.arch }},mode=max
          labels: |
            io.hass.name=${{ steps.manifest.outputs.name }}
            io.hass.version=${{ steps.manifest.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            io.hass.type=addon
          tags: |
            ${{ steps.manifest.outputs.image }}:${{ steps.manifest.outputs.version }}
            ${{ steps.manifest.outputs.image }}:latest
