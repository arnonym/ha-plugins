name: Build ha-sip-kt aarch64

on:
  push:
    branches: [ main, next ]
    # Only the Kotlin app -- the Python ha-sip app has its own workflows.
    paths:
      - 'ha-sip-kt/**'
      - '.github/workflows/build-kt-*.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run :core tests (pure Kotlin, no pjsip/Docker needed)
        working-directory: ha-sip-kt
        run: ./gradlew :core:test --no-daemon --console=plain

  build-aarch64:
    needs: test
    # This same workflow also runs in the beta mirror (ha-plugins-next), which is a
    # force-pushed copy of this repo's `next` branch with the add-on identity rewritten
    # -- there `next` is the publishing branch. Here `next` is just the dev branch, so
    # it only runs the tests above.
    if: github.ref_name == 'main' || endsWith(github.repository, '-next')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read BUILD_FROM base image + add-on image/version
        id: manifest
        working-directory: ha-sip-kt
        run: |
          echo "build_from=$(jq -r '.build_from.aarch64' build.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' config.json)" >> "$GITHUB_OUTPUT"
          # Derive the image name from config.json instead of hard-coding it, so the
          # beta mirror pushes to ghcr.io/arnonym/aarch64-ha-sip-kt-next without
          # needing a separate workflow file.
          echo "image=$(jq -r '.image' config.json | sed 's/{arch}/aarch64/')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push aarch64 image
        uses: docker/build-push-action@v6
        with:
          context: ha-sip-kt
          file: ha-sip-kt/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BUILD_FROM=${{ steps.manifest.outputs.build_from }}
          cache-from: type=gha,scope=kt-aarch64
          cache-to: type=gha,scope=kt-aarch64,mode=max
          tags: |
            ${{ steps.manifest.outputs.image }}:${{ steps.manifest.outputs.version }}
            ${{ steps.manifest.outputs.image }}:latest
